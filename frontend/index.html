<!DOCTYPE html>
<html lang="zh-TW" class="bg-gray-950">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emotion Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script>
    tailwind.config = { theme: { extend: {} } }
  </script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col items-center p-4 sm:p-6 font-sans">
  <div class="w-full max-w-lg space-y-4">

    <!-- Emotion -->
    <div class="bg-gray-900 rounded-2xl p-6 text-center shadow-lg">
      <div id="emotion-emoji" class="text-7xl mb-2">🤷</div>
      <div id="emotion-name" class="text-2xl font-bold text-gray-400">偵測中...</div>
      <div id="emotion-confidence" class="text-lg text-gray-500 mt-1">--%</div>
    </div>

    <!-- Status -->
    <div class="bg-gray-900 rounded-2xl p-4 flex justify-around text-center shadow-lg">
      <div>
        <div class="text-xs text-gray-500 uppercase tracking-wide">FPS</div>
        <div id="fps" class="text-xl font-semibold text-cyan-400">--</div>
      </div>
      <div class="border-r border-gray-700"></div>
      <div>
        <div class="text-xs text-gray-500 uppercase tracking-wide">臉部</div>
        <div id="face-status" class="text-xl font-semibold text-gray-400">--</div>
      </div>
      <div class="border-r border-gray-700"></div>
      <div>
        <div class="text-xs text-gray-500 uppercase tracking-wide">連線</div>
        <div id="connection-status" class="text-xl font-semibold text-green-400">🟢</div>
      </div>
    </div>

    <!-- Bar Chart -->
    <div class="bg-gray-900 rounded-2xl p-4 shadow-lg space-y-3">
      <div id="bar-happy" class="flex items-center gap-2">
        <span class="w-12 text-sm text-right text-green-400">開心</span>
        <div class="flex-1 bg-gray-800 rounded-full h-5 overflow-hidden">
          <div class="h-full rounded-full bg-green-400 transition-all duration-300" style="width:0%"></div>
        </div>
        <span id="pct-happy" class="w-12 text-sm text-gray-400">0%</span>
      </div>
      <div id="bar-sad" class="flex items-center gap-2">
        <span class="w-12 text-sm text-right text-orange-400">難過</span>
        <div class="flex-1 bg-gray-800 rounded-full h-5 overflow-hidden">
          <div class="h-full rounded-full bg-orange-400 transition-all duration-300" style="width:0%"></div>
        </div>
        <span id="pct-sad" class="w-12 text-sm text-gray-400">0%</span>
      </div>
      <div id="bar-angry" class="flex items-center gap-2">
        <span class="w-12 text-sm text-right text-red-500">憤怒</span>
        <div class="flex-1 bg-gray-800 rounded-full h-5 overflow-hidden">
          <div class="h-full rounded-full bg-red-500 transition-all duration-300" style="width:0%"></div>
        </div>
        <span id="pct-angry" class="w-12 text-sm text-gray-400">0%</span>
      </div>
      <div id="bar-neutral" class="flex items-center gap-2">
        <span class="w-12 text-sm text-right text-gray-400">平靜</span>
        <div class="flex-1 bg-gray-800 rounded-full h-5 overflow-hidden">
          <div class="h-full rounded-full bg-gray-400 transition-all duration-300" style="width:0%"></div>
        </div>
        <span id="pct-neutral" class="w-12 text-sm text-gray-400">0%</span>
      </div>
    </div>

    <!-- Trend Chart -->
    <div class="bg-gray-900 rounded-2xl p-4 shadow-lg">
      <canvas id="trend-chart" height="200"></canvas>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
